#logging.level.root=DEBUG

# Esto fuerza la carga de tu archivo local y permite que sobreescriba las propiedades
spring.config.import=optional:classpath:application-local.properties

# Conexi�n al PostgreSQL local que corre en Docker
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci�n JPA para que Hibernate cree las tablas autom�ticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Servir el build de Flutter web como raíz
spring.web.resources.static-locations[0]=file:../jadafit-front/build/web/
spring.web.resources.static-locations[1]=classpath:/META-INF/resources/
spring.web.resources.static-locations[2]=classpath:/resources/
spring.web.resources.static-locations[3]=classpath:/static/
spring.web.resources.static-locations[4]=classpath:/public/

# Confiar en headers de proxy/tunnel (Dev Tunnel, nginx, etc.)
server.forward-headers-strategy=framework

# Forzar a SpringDoc a no usar rutas protegidas si es posible
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Desactivar la validaci�n de seguridad de SpringDoc temporalmente
springdoc.show-login-endpoint=true

jwt.secret=${SEC_KEY}
jwt.expiration-ms=86400000

ai.api.url=http://localhost:8090/v1/chat/completions
ai.api.model=qwen2.5-7b-instruct

# Mailtrap (email de pruebas)
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Límite de subida de imágenes
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
